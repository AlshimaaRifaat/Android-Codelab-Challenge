plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.google.devtools.ksp'
}

android {
    namespace "com.sap.codelab"
    compileSdk = 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId "com.sap.codelab"
        minSdkVersion 27
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        
        // Build config fields for API keys
        buildConfigField "String", "GOOGLE_MAPS_API_KEY", "\"${getApiKey()}\""
        
        // Manifest placeholders for API keys
        manifestPlaceholders = [
            GOOGLE_MAPS_API_KEY: getApiKey()
        ]
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

kotlin {
    target {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }
}

ext {
    kotlinCoroutinesVersion = '1.10.2'
    roomVersion = '2.7.2'
    lifecycleVersion = '2.9.3'
    googleMapsVersion = '19.0.0'
    playServicesLocationVersion = '21.3.0'
    workManagerVersion = '2.10.0'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.android.material:material:1.12.0'

    //Lifecycle, LiveData and ViewModel dependencies
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycleVersion"

    //Room persistence
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    ksp "androidx.room:room-compiler:$roomVersion"

    //Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$kotlinCoroutinesVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlinCoroutinesVersion"

    //Google Maps and Location Services
    implementation "com.google.android.gms:play-services-maps:$googleMapsVersion"
    implementation "com.google.android.gms:play-services-location:$playServicesLocationVersion"
    
    //WorkManager for background tasks
    implementation "androidx.work:work-runtime-ktx:$workManagerVersion"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}

/**
 * Get API key from environment variables or local.properties
 * Production: Use environment variables
 * Development: Use local.properties file
 */
def getApiKey() {
    def apiKey = System.getenv("GOOGLE_MAPS_API_KEY")
    if (apiKey == null) {
        // Fallback to local.properties for development
        def localProperties = new Properties()
        def localPropertiesFile = rootProject.file('local.properties')
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withInputStream { localProperties.load(it) }
            apiKey = localProperties.getProperty('GOOGLE_MAPS_API_KEY')
        }
    }
    
    if (apiKey == null) {
        throw new GradleException("""
            GOOGLE_MAPS_API_KEY not found!
            
            Please set your Google Maps API key using one of these methods:
            
            1. Environment Variable (Recommended for CI/CD):
               export GOOGLE_MAPS_API_KEY=your_api_key_here
            
            2. Local Properties (For development):
               Create local.properties file in project root with:
               GOOGLE_MAPS_API_KEY=your_api_key_here
            
            3. Copy from template:
               cp local.properties.template local.properties
               # Then edit local.properties and add your API key
            
            Get your API key from: https://console.cloud.google.com/
            """.stripIndent())
    }
    
    return apiKey
}
